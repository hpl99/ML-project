[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ursafe"
version = "0.1.0"
description = "URsafe: Terrain Hazard Prediction & AI Navigation Companion"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "backend*"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.27",
    "coverage>=7.0",
    "pytest-asyncio>=0.21",
]
